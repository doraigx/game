<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リポート・イラスト管理ダッシュボード</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f5f7fb; margin: 0; }
    .report-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
    .report-meta { font-size: 12px; color: #666; margin-bottom: 8px; }
    #login-section { margin-bottom: 20px; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
    button:hover { background-color: #357ae8; }
    .hidden { display: none !important; }

    /* タブバー */
    .tab-bar { display: flex; gap: 10px; margin: 15px 0 20px 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .tab-btn { background-color: #e0e0e0; color: #333; font-size: 14px; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
    .tab-btn.active { background-color: #4285f4; color: white; }

    /* イラスト一覧グリッド */
    .art-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }
    .art-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .art-img-wrap {
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .art-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
      display: block;
      background-color: #fff;
    }
    .art-info {
      padding: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }
    .art-answer {
      font-weight: bold;
      font-size: 15px;
      color: #1a73e8;
      word-break: break-all;
    }
    .art-meta-item {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .art-label {
      font-weight: bold;
      color: #777;
      margin-right: 4px;
    }

    /* 削除ボタン */
    .btn-delete {
      background-color: #ea4335;
      color: white;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      align-self: flex-end;
    }
    .btn-delete:hover {
      background-color: #d33426;
    }

    /* 画像拡大モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 6px;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <h1>管理ダッシュボード</h1>
  
  <div id="login-section">
    <p>管理者のGoogleアカウントでログインしてください。</p>
    <button id="btn-admin-login">管理者ログイン</button>
  </div>

  <div id="dashboard-section" class="hidden">
    <p id="admin-status" style="font-weight:bold; color:#137333;"></p>

    <!-- タブ切り替えボタン -->
    <div class="tab-bar">
      <button id="tab-btn-reports" class="tab-btn active">リポート一覧</button>
      <button id="tab-btn-arts" class="tab-btn">みんなのイラスト一覧</button>
    </div>

    <!-- リポート一覧 -->
    <div id="tab-content-reports">
      <h2>通報・リポート</h2>
      <div id="report-list">読み込み中...</div>
    </div>

    <!-- イラスト一覧 -->
    <div id="tab-content-arts" class="hidden">
      <h2>投稿されたイラスト</h2>
      <div id="art-list" class="art-grid">読み込み中...</div>
    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div id="img-modal" class="modal-overlay hidden" onclick="this.classList.add('hidden')">
    <img id="modal-image" class="modal-img" src="" alt="拡大画像" />
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyCDh_z0Ol_Dc0wDz3e1NTAnUYVbF3AgQCw",
      authDomain: "ohekaki.firebaseapp.com",
      projectId: "ohekaki",
      storageBucket: "ohekaki.firebasestorage.app",
      messagingSenderId: "835719435378",
      appId: "1:835719435378:web:6dccc98680a63e1f775eeb",
      measurementId: "G-9TJ9SNFVX1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById("login-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const adminStatus = document.getElementById("admin-status");

    const tabBtnReports = document.getElementById("tab-btn-reports");
    const tabBtnArts = document.getElementById("tab-btn-arts");
    const tabContentReports = document.getElementById("tab-content-reports");
    const tabContentArts = document.getElementById("tab-content-arts");

    const reportListContainer = document.getElementById("report-list");
    const artListContainer = document.getElementById("art-list");

    const imgModal = document.getElementById("img-modal");
    const modalImage = document.getElementById("modal-image");

    // タブ切り替え
    tabBtnReports.addEventListener("click", () => {
      tabBtnReports.classList.add("active");
      tabBtnArts.classList.remove("active");
      tabContentReports.classList.remove("hidden");
      tabContentArts.classList.add("hidden");
    });

    tabBtnArts.addEventListener("click", () => {
      tabBtnArts.classList.add("active");
      tabBtnReports.classList.remove("active");
      tabContentArts.classList.remove("hidden");
      tabContentReports.classList.add("hidden");
      fetchArts();
    });

    document.getElementById("btn-admin-login").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("ログインに失敗しました。");
        console.error(error);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        adminStatus.textContent = `ログイン中: ${user.email}`;
        fetchReports();
      } else {
        loginSection.classList.remove("hidden");
        dashboardSection.classList.add("hidden");
      }
    });

    // リポート取得
    async function fetchReports() {
      try {
        reportListContainer.innerHTML = "データを取得中...";
        const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          reportListContainer.innerHTML = "リポートはありません。";
          return;
        }

        reportListContainer.innerHTML = "";
        snap.forEach(docSnap => {
          const docId = docSnap.id;
          const data = docSnap.data();
          const card = document.createElement("div");
          card.className = "report-card";
          
          const dateStr = data.timestamp ? data.timestamp.toDate().toLocaleString() : "時刻不明";
          card.innerHTML = `
            <div class="report-meta">
              日時: ${dateStr} | 報告者: ${data.reporterName || "名無し"}<br>
              部屋ID: ${data.activeRoomId || "-"}
            </div>
            <div style="white-space: pre-wrap;">${data.content || ""}</div>
            <button class="btn-delete" style="float: right; margin-top: -20px;">削除</button>
          `;

          // リポート削除処理
          const delBtn = card.querySelector(".btn-delete");
          delBtn.addEventListener("click", async () => {
            if (!confirm("このリポートを削除しますか？")) return;
            try {
              await deleteDoc(doc(db, "reports", docId));
              card.remove();
            } catch (err) {
              console.error("削除エラー:", err);
              alert("削除に失敗しました。権限を確認してください。");
            }
          });

          reportListContainer.appendChild(card);
        });
      } catch (error) {
        console.error("リポート取得エラー:", error);
        reportListContainer.innerHTML = `<span style="color:red;">リポートの取得に失敗しました。</span>`;
      }
    }

    // イラスト一覧取得 (art_posts)
    async function fetchArts() {
      try {
        artListContainer.innerHTML = "イラストを取得中...";
        
        let snap;
        try {
          const q = query(collection(db, "art_posts"), orderBy("createdAt", "desc"));
          snap = await getDocs(q);
        } catch (e) {
          snap = await getDocs(collection(db, "art_posts"));
        }

        if (snap.empty) {
          artListContainer.innerHTML = "<p>投稿されたイラストはまだありません。</p>";
          return;
        }

        artListContainer.innerHTML = "";
        snap.forEach(docSnap => {
          const docId = docSnap.id;
          const data = docSnap.data();

          // 画像データの取得（data:image または http 形式）
          let imgData = data.artData || data.canvasData || data.image || data.imageData || 
                        data.imageUrl || data.url || data.dataUrl || data.dataURL || "";

          if (!imgData) {
            for (const key in data) {
              if (typeof data[key] === "string" && (data[key].startsWith("data:image") || data[key].startsWith("http"))) {
                imgData = data[key];
                break;
              }
            }
          }

          const answer = data.answerWord || data.word || data.theme || data.title || "（答えなし）";
          const drawer = data.drawerName || data.authorName || data.userName || data.creatorName || "名無し";

          const timeField = data.createdAt || data.timestamp;
          let dateStr = "日時不明";
          if (timeField) {
            if (typeof timeField.toDate === "function") {
              dateStr = timeField.toDate().toLocaleString();
            } else if (timeField instanceof Date) {
              dateStr = timeField.toLocaleString();
            } else if (typeof timeField === "number" || typeof timeField === "string") {
              dateStr = new Date(timeField).toLocaleString();
            }
          }

          const card = document.createElement("div");
          card.className = "art-card";

          const imgHtml = imgData
            ? `<img src="${imgData}" alt="${answer}" loading="lazy" class="clickable-art" />`
            : `<div style="padding:20px;text-align:center;color:#999;font-size:12px;">画像データなし</div>`;

          card.innerHTML = `
            <div class="art-img-wrap">
              ${imgHtml}
            </div>
            <div class="art-info">
              <div class="art-answer">🎨 答え: ${answer}</div>
              <div class="art-meta-item"><span class="art-label">描いた人:</span>${drawer}</div>
              <div class="art-meta-item"><span class="art-label">作成日時:</span>${dateStr}</div>
              <button class="btn-delete">イラストを削除</button>
            </div>
          `;

          // 画像拡大モーダル
          if (imgData) {
            const imgEl = card.querySelector(".clickable-art");
            imgEl.addEventListener("click", () => {
              modalImage.src = imgData;
              imgModal.classList.remove("hidden");
            });
          }

          // イラスト削除処理
          const delBtn = card.querySelector(".btn-delete");
          delBtn.addEventListener("click", async () => {
            const ok = confirm(`「${answer}」のイラストを削除してもよろしいですか？`);
            if (!ok) return;

            delBtn.disabled = true;
            delBtn.textContent = "削除中...";

            try {
              await deleteDoc(doc(db, "art_posts", docId));
              card.remove(); // 画面上から即座に消去
            } catch (err) {
              console.error("削除エラー:", err);
              alert("削除に失敗しました。Firestoreのセキュリティルール（削除権限）を確認してください。");
              delBtn.disabled = false;
              delBtn.textContent = "イラストを削除";
            }
          });

          artListContainer.appendChild(card);
        });
      } catch (error) {
        console.error("イラスト取得エラー:", error);
        artListContainer.innerHTML = `<span style="color:red;">イラストの取得に失敗しました。</span><br>コンソール(F12)のエラーログを確認してください。`;
      }
    }
  </script>
</body>
</html>
